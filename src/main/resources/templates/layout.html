<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Token CSRF usado pelas chamadas fetch() das páginas -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            // fetch() com o cabeçalho CSRF e JSON. Também serve para testar a API pelo console do navegador.
            async function apiFetch(url, method = 'GET', body = null) {
                const headers = { 'Content-Type': 'application/json' };
                headers[document.querySelector('meta[name="_csrf_header"]').content] =
                        document.querySelector('meta[name="_csrf"]').content;
                const resp = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
                const texto = await resp.text();
                let dados = null;
                try { dados = texto ? JSON.parse(texto) : null; } catch (e) { dados = texto; }
                return { status: resp.status, ok: resp.ok, dados };
            }
        </script>
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
