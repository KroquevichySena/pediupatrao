<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <!-- Os itens do menu são escondidos por perfil apenas por usabilidade;
             as permissões de verdade estão no SecurityConfig e nos @PreAuthorize. -->
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3">Pediu Patrão</h4>
                <div class="text-center small mb-3" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                    <span class="badge bg-danger ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="badge bg-warning text-dark ms-1" sec:authorize="hasRole('GERENTE')">GERENTE</span>
                    <span class="badge bg-info text-dark ms-1" sec:authorize="hasRole('ATENDENTE')">ATENDENTE</span>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ATENDENTE','GERENTE')">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-journal-text"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            <i class="bi bi-gear"></i><span class="d-none d-md-inline">&nbsp;Configurações</span>
                            <span class="float-end">&#9662;</span>
                        </a>
                        <ul class="nav flex-column submenu">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/produtos}">
                                    <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                                </a>
                            </li>
                            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                                <a class="nav-link" th:href="@{/usuarios}">
                                    <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item mt-3" sec:authorize="isAuthenticated()">
                        <!-- Logout por POST, com token CSRF incluído automaticamente pelo th:action -->
                        <form th:action="@{/logout}" method="post" class="px-3">
                            <button type="submit" class="btn btn-sm btn-outline-light w-100">
                                <i class="bi bi-box-arrow-right"></i><span class="d-none d-md-inline">&nbsp;Sair</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
