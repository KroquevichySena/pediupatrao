<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
    </div>
    <p class="text-muted small mb-4">
        Registros somente leitura. Telefones são exibidos mascarados e senhas nunca são gravadas.
    </p>

    <form th:action="@{/auditoria}" method="get" class="row g-2 mb-4" style="max-width: 640px;">
        <div class="col-sm-4">
            <select name="entidade" class="form-select">
                <option value="">Todas as entidades</option>
                <option th:each="e : ${ {'PEDIDO','CLIENTE','USUARIO'} }" th:value="${e}" th:text="${e}"
                        th:selected="${entidade != null and #strings.equalsIgnoreCase(entidade, e)}"></option>
            </select>
        </div>
        <div class="col-sm-5">
            <input type="text" name="entidadeId" class="form-control" placeholder="ID do registro (opcional)"
                   th:value="${entidadeId}">
        </div>
        <div class="col-sm-3 d-grid">
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filtrar</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:replace="~{auditoria/lista :: tabela(registros=${registros})}"></div>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(registros)}">
            <strong th:text="${#lists.size(registros)}"></strong> registro(s) — os mais recentes primeiro
        </div>
    </div>
</div>

<!-- Tabela reaproveitada também na tela de detalhe do pedido -->
<div th:fragment="tabela(registros)" class="table-responsive">
    <table class="table table-sm align-middle mb-0">
        <thead class="table-dark">
            <tr>
                <th class="ps-3">Data e hora</th>
                <th>Usuário</th>
                <th>Operação</th>
                <th>Registro</th>
                <th>Alterações (anterior → novo)</th>
                <th class="pe-3">Justificativa</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="6" class="text-center text-muted py-4">Nenhum registro de auditoria.</td>
            </tr>
            <tr th:each="r : ${registros}">
                <td class="ps-3 text-nowrap" th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td>
                    <span th:text="${r.usuario}"></span>
                    <small class="badge bg-secondary" th:text="${r.perfil}"></small>
                </td>
                <td th:text="${r.operacao.descricao}"></td>
                <td>
                    <small class="text-muted" th:text="${r.entidade}"></small><br>
                    <a th:if="${r.entidade == 'PEDIDO'}" th:href="@{/pedidos/{id}(id=${r.entidadeId})}"
                       class="font-monospace small" th:text="${r.entidadeId}"></a>
                    <a th:unless="${r.entidade == 'PEDIDO'}" th:href="@{/auditoria(entidade=${r.entidade},entidadeId=${r.entidadeId})}"
                       class="font-monospace small" th:text="${r.entidadeId}"></a>
                </td>
                <td>
                    <div th:each="a : ${r.alteracoes}" class="small">
                        <strong th:text="${a.campo}"></strong>:
                        <span class="text-danger" th:text="${a.valorAnterior ?: '∅'}"></span>
                        →
                        <span class="text-success" th:text="${a.valorNovo ?: '∅'}"></span>
                    </div>
                </td>
                <td class="pe-3 small" th:text="${r.justificativa ?: ''}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
